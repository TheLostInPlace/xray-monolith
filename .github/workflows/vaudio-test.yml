name: vaudio test build

on:
  push:
    branches: [ "vaudio-crashfixes-mt" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLUTION_FILE_PATH: src/engine-vs2022.sln
  PACK_GAMEDATA_NAME: 00_modded_exes_gamedata.db0

jobs:
  pack_gamedata:
    name: pack_gamedata
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Pack gamedata
      run: |
        new-item -path "./compressor/gamedata" -itemtype directory -force
        copy-item -path "./gamedata/*" -destination "./compressor/gamedata" -recurse -force
        cd ./compressor
        start-process -filepath "./! compress_gamedata.cmd" -Wait
        rename-item -path gamedata.db0 -newname ${{env.PACK_GAMEDATA_NAME}}

    - name: Upload gamedata
      uses: actions/upload-artifact@v4.6.0
      with:
        name: gamedata
        path: ./compressor/${{env.PACK_GAMEDATA_NAME}}
        if-no-files-found: "error"
        retention-days: 1

  build:
    name: build-${{matrix.buildconf}}
    runs-on: windows-latest

    strategy:
      matrix:
        buildconf: ["DX11", "DX11-AVX"]

    steps:
    - name: Configure Pagefile
      uses: al-cheb/configure-pagefile-action@v1.3
      with:
        minimum-size: 8GB
        maximum-size: 8GB
        disk-root: "C:"

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Init submodules
      uses: snickerbockers/submodules-init@v4

    - name: setup-msbuild
      uses: microsoft/setup-msbuild@v1.3.1
      with:
        msbuild-architecture: "x64"

    - name: Build ${{matrix.buildconf}}
      run: msbuild /p:Configuration=${{matrix.buildconf}} ${{env.SOLUTION_FILE_PATH}}

    - name: Upload Exe
      uses: actions/upload-artifact@v4.6.0
      with:
        name: exe_${{matrix.buildconf}}
        path: ./_build/_game/bin_dbg/*.exe
        if-no-files-found: "error"
        retention-days: 1

    - name: Upload PDB
      uses: actions/upload-artifact@v4.6.0
      with:
        name: pdb_${{matrix.buildconf}}
        path: ./_build/_game/bin_dbg/*.pdb
        if-no-files-found: "error"
        retention-days: 30

  bundle:
    needs: [pack_gamedata, build]
    name: bundle
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        sparse-checkout: sdk/binaries

    - name: Download exes
      uses: actions/download-artifact@v4.1.8
      with:
        pattern: exe_*

    - name: Download gamedata
      uses: actions/download-artifact@v4.1.8
      with:
        name: gamedata
        path: gamedata

    - name: Assemble
      id: assemble
      run: |
        mkdir -p bundle/bin bundle/db/mods
        cp exe_*/*.exe bundle/bin
        cp sdk/binaries/vaudionative.dll bundle/bin
        cp -r sdk/binaries/vaudio-dev bundle/vaudio-dev
        cp sdk/binaries/vaudio-LICENCE.txt bundle
        cp gamedata/*.db0 bundle/db/mods
        echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - name: Upload bundle
      uses: actions/upload-artifact@v4.6.0
      with:
        name: vaudio-crashfixes-mt-${{steps.assemble.outputs.sha}}
        path: bundle
        if-no-files-found: "error"
        retention-days: 30
