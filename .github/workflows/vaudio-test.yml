name: vaudio test build

on:
  push:
    branches: [ "vaudio-crashfixes-mt" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLUTION_FILE_PATH: src/engine-vs2022.sln
  PACK_GAMEDATA_NAME: 00_modded_exes_gamedata.db0

jobs:
  pack_gamedata:
    name: pack_gamedata
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Pack gamedata
      run: |
        new-item -path "./compressor/gamedata" -itemtype directory -force
        copy-item -path "./gamedata/*" -destination "./compressor/gamedata" -recurse -force
        cd ./compressor
        start-process -filepath "./! compress_gamedata.cmd" -Wait
        rename-item -path gamedata.db0 -newname ${{env.PACK_GAMEDATA_NAME}}

    - name: Upload gamedata
      uses: actions/upload-artifact@v7
      with:
        name: gamedata
        path: ./compressor/${{env.PACK_GAMEDATA_NAME}}
        if-no-files-found: "error"
        retention-days: 1

  build:
    name: build-${{matrix.buildconf}}
    runs-on: windows-latest

    strategy:
      matrix:
        buildconf: ["DX11", "DX11-AVX"]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: setup-msbuild
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: "x64"

    - name: Build ${{matrix.buildconf}}
      run: msbuild /p:Configuration=${{matrix.buildconf}} ${{env.SOLUTION_FILE_PATH}}

    - name: Upload Exe
      uses: actions/upload-artifact@v7
      with:
        name: exe_${{matrix.buildconf}}
        path: ./_build/_game/bin_dbg/*.exe
        if-no-files-found: "error"
        retention-days: 1

    - name: Upload PDB
      uses: actions/upload-artifact@v7
      with:
        name: pdb_${{matrix.buildconf}}
        path: ./_build/_game/bin_dbg/*.pdb
        if-no-files-found: "error"
        retention-days: 30

  bundle:
    needs: [pack_gamedata, build]
    name: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        sparse-checkout: sdk/binaries

    - name: Download exes
      uses: actions/download-artifact@v8
      with:
        pattern: exe_*

    - name: Download pdbs
      uses: actions/download-artifact@v8
      with:
        pattern: pdb_*

    - name: Download gamedata
      uses: actions/download-artifact@v8
      with:
        name: gamedata
        path: gamedata

    - name: Assemble
      id: assemble
      run: |
        sha=$(git rev-parse --short HEAD)
        name="vaudio-crashfixes-mt-$sha"
        mkdir -p bundle/bin bundle/db/mods pdb
        cp exe_*/*.exe bundle/bin
        cp sdk/binaries/vaudionative.dll bundle/bin
        cp -r sdk/binaries/vaudio-dev bundle/vaudio-dev
        cp sdk/binaries/vaudio-LICENCE.txt bundle
        cp gamedata/*.db0 bundle/db/mods
        cp pdb_*/*.pdb pdb
        (cd bundle && zip -qr "../$name.zip" .)
        (cd pdb && zip -qr "../$name-pdb.zip" .)
        echo "name=$name" >> "$GITHUB_OUTPUT"

    - name: Upload bundle
      uses: actions/upload-artifact@v7
      with:
        name: ${{steps.assemble.outputs.name}}
        path: bundle
        if-no-files-found: "error"
        retention-days: 30

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{steps.assemble.outputs.name}}
        name: ${{steps.assemble.outputs.name}}
        target_commitish: ${{github.sha}}
        prerelease: true
        make_latest: false
        fail_on_unmatched_files: true
        files: |
          ${{steps.assemble.outputs.name}}.zip
          ${{steps.assemble.outputs.name}}-pdb.zip
        body: |
          Test build of MT with Vercidium raytraced audio and the MT and pr crash fixes, from ${{github.sha}}.

          Extract the bundle zip over the game folder. It puts the DX11 and DX11-AVX exes and vaudionative.dll in bin and the engine gamedata in db/mods.
          vaudio-dev holds the SDK dev build and its debug window, with a README on swapping it in.
          The pdb zip has the matching symbols for crash dumps.
